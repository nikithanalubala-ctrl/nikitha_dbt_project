trigger:
- main

schedules:
- cron: "30 6 * * *"
  displayName: "Daily 12:00 PM IST Run"
  branches:
    include:
      - main
  always: true

stages:

# ==========================================
# Stage 1 - Deploy to DEV
# ==========================================
- stage: Deploy_DEV
  displayName: "Deploy to DEV"

  variables:
  - group: new_group

  jobs:
  - job: Build_DEV
    displayName: "Build DEV"

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install dbt-core==1.12.0 dbt-databricks==1.10.9
      displayName: "Install dbt"

    - script: |
        mkdir -p ~/.dbt

        cat <<EOF > ~/.dbt/profiles.yml
        nikitha_dbt_project:
          target: dev
          outputs:
            dev:
              type: databricks
              catalog: $(DBT_CATALOG)
              schema: $(DBT_SCHEMA)
              host: $(DATABRICKS_HOST)
              http_path: $(DATABRICKS_HTTP_PATH)
              token: $(DATABRICKS_TOKEN)
              threads: 1
        EOF
      displayName: "Create profiles.yml"

    - script: dbt debug
      displayName: "Test Connection"
      env:
        SOURCE_CATALOG: $(SOURCE_CATALOG)

    - script: dbt deps
      displayName: "Install Packages"
      env:
        SOURCE_CATALOG: $(SOURCE_CATALOG)

    - script: dbt build
      displayName: "Deploy to DEV"
      env:
        SOURCE_CATALOG: $(SOURCE_CATALOG)

# ==========================================
# Stage 2 - Deploy to PROD
# ==========================================
- stage: Deploy_PROD
  displayName: "Deploy to PROD"

  dependsOn: Deploy_DEV
  condition: succeeded()

  variables:
  - group: prod_var_group

  jobs:
  - job: Build_PROD
    displayName: "Build PROD"

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install dbt-core==1.12.0 dbt-databricks==1.10.9
      displayName: "Install dbt"

    - script: |
        mkdir -p ~/.dbt

        cat <<EOF > ~/.dbt/profiles.yml
        nikitha_dbt_project:
          target: prod
          outputs:
            prod:
              type: databricks
              catalog: $(DBT_CATALOG)
              schema: $(DBT_SCHEMA)
              host: $(DATABRICKS_HOST)
              http_path: $(DATABRICKS_HTTP_PATH)
              token: $(DATABRICKS_TOKEN)
              threads: 1
        EOF
      displayName: "Create profiles.yml"

    - script: dbt debug
      displayName: "Test Connection"
      env:
        SOURCE_CATALOG: $(SOURCE_CATALOG)

    - script: dbt deps
      displayName: "Install Packages"
      env:
        SOURCE_CATALOG: $(SOURCE_CATALOG)

    - script: dbt build
      displayName: "Deploy to PROD"
      env:
        SOURCE_CATALOG: $(SOURCE_CATALOG)